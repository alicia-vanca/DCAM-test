name: Build and Release

on:
  push:
    branches:
      - develop
      - release

permissions:
  contents: write

env:
  APP_VERSION: 0.${{ github.run_number }}
  BODYCAM_CRYPTO_PASSWORD: ${{ secrets.BODYCAM_CRYPTO_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test

      - name: Build APK
        run: |
          printf 'LOGGLY_TOKEN=%s\n' '${{ secrets.LOGGLY_TOKEN }}' > application-local.properties
          if [ "${GITHUB_REF_NAME}" = "release" ]; then
            ./gradlew clean assembleRelease
            mkdir -p build/release
            cp app/build/outputs/apk/release/*.apk "build/release/DCAM-${APP_VERSION}.apk"
          else
            ./gradlew clean assembleDebug
            mkdir -p build/release
            cp app/build/outputs/apk/debug/*.apk "build/release/DCAM-dev-${APP_VERSION}.apk"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DCAM-${{ github.ref_name }}-${{ env.APP_VERSION }}
          path: build/release/*.apk
          retention-days: 7

      - name: Upload Release Asset
        if: github.ref == 'refs/heads/release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Release v${{ env.APP_VERSION }}
          files: build/release/*.apk
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
