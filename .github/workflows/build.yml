name: Build and Release

on:
  push:
    branches:
      - develop
      - release

permissions:
  contents: write

env:
  APP_VERSION: 0.1.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Run unit tests
        shell: bash
        run: |
          while IFS='=' read -r name policy; do
            [[ "$name" =~ ^[A-Z][A-Z0-9_]*$ ]] || continue
            export "$name=test-only-${name,,}"
          done < build-secrets.properties
          ./gradlew --no-configuration-cache test

      - name: Prepare release signing
        shell: bash
        env:
          DCAM_RELEASE_KEYSTORE_BASE64: ${{ secrets.DCAM_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DCAM_RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Missing required GitHub secret: DCAM_RELEASE_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$DCAM_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dcam-release.keystore"
          if [ ! -s "$RUNNER_TEMP/dcam-release.keystore" ]; then
            echo "::error::Decoded release keystore is empty"
            exit 1
          fi

      - name: Build APK
        env:
          DCAM_CRYPTO_PASSWORD: ${{ secrets.DCAM_CRYPTO_PASSWORD }}
          LOGGLY_TOKEN: ${{ secrets.LOGGLY_TOKEN }}
          DCAM_RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/dcam-release.keystore
          DCAM_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.DCAM_RELEASE_KEYSTORE_PASSWORD }}
          DCAM_RELEASE_KEY_ALIAS: ${{ secrets.DCAM_RELEASE_KEY_ALIAS }}
          DCAM_RELEASE_KEY_PASSWORD: ${{ secrets.DCAM_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-configuration-cache --no-daemon clean assembleRelease
          mkdir -p build/release
          if [ "${GITHUB_REF_NAME}" = "release" ]; then
            cp app/build/outputs/apk/release/*.apk "build/release/DCAM-${APP_VERSION}.apk"
          else
            cp app/build/outputs/apk/release/*.apk "build/release/DCAM-dev-${APP_VERSION}.apk"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DCAM-${{ env.APP_VERSION }}
          path: build/release/*.apk
          retention-days: 7

      - name: Upload Release Asset
        if: github.ref == 'refs/heads/release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Release v${{ env.APP_VERSION }}
          files: build/release/*.apk
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify failure
        if: failure()
        shell: bash
        env:
          X_WEBHOOK_SECRET: ${{ secrets.X_WEBHOOK_SECRET }}
          WEBHOOK_SENDER: ${{ github.actor }}
          WEBHOOK_MESSAGE: "DCAM: ${{ github.workflow }} failed! (#${{ github.run_number }})"
        run: |
          jq -n \
            --arg sender "$WEBHOOK_SENDER" \
            --arg message "$WEBHOOK_MESSAGE" \
            '{sender: $sender, message: $message}' |
            curl --fail-with-body --silent --show-error \
              -H "Content-Type: application/json" \
              -H "X-Webhook-Secret: ${X_WEBHOOK_SECRET}" \
              --data-binary @- \
              "https://forward-to-snt.quyendt3k4.workers.dev"