plugins {
    id 'com.android.application'
}

def cameraXVersion = '1.6.1'
def junitVersion = '6.1.0'
def roomVersion = '2.8.4'
def appProperties = new Properties()
def appPropertiesFile = rootProject.file('application.properties')
def appLocalPropertiesFile = rootProject.file('application-local.properties')
if (appPropertiesFile.exists()) appPropertiesFile.withInputStream { appProperties.load(it) }
if (appLocalPropertiesFile.exists()) appLocalPropertiesFile.withInputStream { appProperties.load(it) }

def buildConfigValue = { value -> "\"${String.valueOf(value).replace('\\', '\\\\').replace('"', '\\"')}\"" }
def propertyValue = { key -> System.getenv(key) ?: appProperties.getProperty(key, '') }

android {
    namespace = 'com.dvid.dcam'
    enableKotlin = false
    compileSdk {
        version = release(36) {
            it.minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId = 'com.dvid.dcam'
        minSdk = 26
        targetSdk = 36
        versionCode = 1
        versionName = '1.0'
        appProperties.stringPropertyNames().each { key ->
            buildConfigField 'String', key, buildConfigValue(propertyValue(key))
        }

        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    buildTypes {
        release {
            optimization {
                enable = false
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation project(':core')

    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.fragment:fragment:1.5.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation "androidx.camera:camera-camera2:${cameraXVersion}"
    implementation "androidx.camera:camera-core:${cameraXVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraXVersion}"
    implementation "androidx.camera:camera-video:${cameraXVersion}"
    implementation "androidx.camera:camera-view:${cameraXVersion}"
    implementation "androidx.room:room-runtime:${roomVersion}"
    implementation 'androidx.work:work-runtime:2.11.2'
    annotationProcessor "androidx.room:room-compiler:${roomVersion}"
    implementation 'org.springframework.security:spring-security-crypto:6.3.1'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junitVersion}"

    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    def crashDir = rootProject.layout.buildDirectory.dir('jvm-crash').get().asFile
    crashDir.mkdirs()
    jvmArgs "-XX:ErrorFile=${new File(crashDir, 'hs_err_pid%p.log').absolutePath}",
            "-XX:HeapDumpPath=${crashDir.absolutePath}"
}
