# App build-time config.
# application-local.properties overrides these values and is ignored by git.
# GitHub Actions writes LOGGLY_TOKEN into application-local.properties before build.
# GitHub Actions can override BODYCAM_CRYPTO_PASSWORD.
LOGGLY_TOKEN
BODYCAM_CRYPTO_PASSWORD
# DEFAULT_STORAGE_MODE accepted values: APP_DATA, PUBLIC_DCIM (not supported yet)
DEFAULT_STORAGE_MODE=APP_DATA
