def manifestFile = rootProject.file('build-secrets.properties')
if (!manifestFile.isFile()) {
    throw new GradleException("Missing build secret manifest: ${manifestFile}")
}

def manifest = new Properties()
manifestFile.withReader('UTF-8') { manifest.load(it) }
def localPropertiesFile = rootProject.file('application-local.properties')
def appProperties = new Properties()
def appPropertiesFile = rootProject.file('application.properties')
if (appPropertiesFile.isFile()) {
    appPropertiesFile.withReader('UTF-8') { appProperties.load(it) }
}

def secretNames = manifest.stringPropertyNames().toList().sort()
def invalidNames = secretNames.findAll { name ->
    !(name ==~ /[A-Z][A-Z0-9_]*/) || name.endsWith('_CONFIGURED')
}
if (!invalidNames.isEmpty()) {
    throw new GradleException("Invalid build secret names: ${invalidNames.join(', ')}")
}
def validPolicies = ['optional', 'required', 'required-release']
def invalidPolicies = secretNames.findAll { name -> !validPolicies.contains(manifest.getProperty(name)) }
if (!invalidPolicies.isEmpty()) {
    throw new GradleException("Invalid build secret policies for: ${invalidPolicies.join(', ')}")
}
def trackedSecrets = secretNames.findAll { name -> appProperties.containsKey(name) }
if (!trackedSecrets.isEmpty()) {
    throw new GradleException("Build secrets must not be declared in application.properties: ${trackedSecrets.join(', ')}")
}

def loadSecretValues = {
    def localProperties = new Properties()
    if (localPropertiesFile.isFile()) {
        localPropertiesFile.withReader('UTF-8') { localProperties.load(it) }
    }
    secretNames.collectEntries { name ->
        [(name): System.getenv(name) ?: localProperties.getProperty(name, '')]
    }
}
def minimumSecretBytes = 8
def shortSecretNames = { values ->
    values.findAll { name, value ->
        !value.isBlank()
                && value.getBytes(java.nio.charset.StandardCharsets.UTF_8).length < minimumSecretBytes
    }.keySet().toList()
}
def requiredNames = secretNames.findAll { name -> manifest.getProperty(name) == 'required' }
def releaseRequiredNames = secretNames.findAll { name ->
    ['required', 'required-release'].contains(manifest.getProperty(name))
}
def generatedDir = layout.buildDirectory.dir('generated/source/buildSecrets/main').get().asFile
def byteArraySource = { bytes ->
    "new byte[] {${bytes.collect { value -> value.toString() }.join(', ')}}"
}

def generateBuildSecrets = tasks.register('generateBuildSecrets') {
    outputs.dir(generatedDir)
    outputs.upToDateWhen { false }
    outputs.doNotCacheIf('Generated source contains obfuscated build secrets') { true }
    doLast {
        def secretValues = loadSecretValues()
        def missing = requiredNames.findAll { name -> secretValues.get(name).isBlank() }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing required build secrets: ${missing.join(', ')}")
        }
        def tooShort = shortSecretNames(secretValues)
        if (!tooShort.isEmpty()) {
            throw new GradleException("Build secrets must be at least ${minimumSecretBytes} UTF-8 bytes: ${tooShort.join(', ')}")
        }

        if (generatedDir.isDirectory()) {
            def generatedPaths = java.nio.file.Files.walk(generatedDir.toPath())
            try {
                generatedPaths.sorted(java.util.Comparator.reverseOrder())
                        .forEach { path -> java.nio.file.Files.deleteIfExists(path) }
            } finally {
                generatedPaths.close()
            }
        }
        def packageDir = new File(generatedDir, 'com/dvid/dcam')
        packageDir.mkdirs()
        def random = new java.security.SecureRandom()
        def entries = secretNames.collect { name ->
            byte[] value = secretValues.get(name).getBytes(java.nio.charset.StandardCharsets.UTF_8)
            byte[] mask = new byte[value.length]
            byte[] encoded = new byte[value.length]
            random.nextBytes(mask)
            for (int index = 0; index < value.length; index++) {
                encoded[index] = (byte) (value[index] ^ mask[index])
            }
            byte[] recovered = new byte[value.length]
            for (int index = 0; index < value.length; index++) {
                recovered[index] = (byte) (encoded[index] ^ mask[index])
            }
            if (!java.util.Arrays.equals(value, recovered)) {
                throw new GradleException("Build secret generation failed for ${name}")
            }
            java.util.Arrays.fill(value, (byte) 0)
            java.util.Arrays.fill(recovered, (byte) 0)
            [name: name, configured: !secretValues.get(name).isBlank(), mask: mask, encoded: encoded]
        }

        def source = new StringBuilder()
                .append('package com.dvid.dcam;\n\n')
                .append('import java.nio.charset.StandardCharsets;\n')
                .append('import java.util.Arrays;\n\n')
                .append('public final class BuildSecrets {\n')
                .append('    private BuildSecrets() {\n')
                .append('    }\n')
        entries.eachWithIndex { entry, index ->
            source.append("\n    private static final byte[] M${index} = ${byteArraySource(entry.mask)};\n")
                    .append("    private static final byte[] E${index} = ${byteArraySource(entry.encoded)};\n")
                    .append("\n    public static String ${entry.name}() {\n")
                    .append("        return decode(M${index}, E${index});\n")
                    .append('    }\n')
                    .append("\n    public static boolean ${entry.name}_CONFIGURED() {\n")
                    .append("        return ${entry.configured};\n")
                    .append('    }\n')
        }
        source.append('\n    private static String decode(byte[] mask, byte[] encoded) {\n')
                .append('        byte[] value = new byte[encoded.length];\n')
                .append('        for (int index = 0; index < value.length; index++) {\n')
                .append('            value[index] = (byte) (encoded[index] ^ mask[index]);\n')
                .append('        }\n')
                .append('        String decoded = new String(value, StandardCharsets.UTF_8);\n')
                .append('        Arrays.fill(value, (byte) 0);\n')
                .append('        return decoded;\n')
                .append('    }\n')
                .append('}\n')

        def outputFile = new File(packageDir, 'BuildSecrets.java')
        outputFile.withOutputStream { stream ->
            stream.write(source.toString().getBytes(java.nio.charset.StandardCharsets.UTF_8))
        }
        entries.each { entry ->
            java.util.Arrays.fill(entry.mask, (byte) 0)
            java.util.Arrays.fill(entry.encoded, (byte) 0)
        }
    }
}
generateBuildSecrets.configure {
    mustRunAfter(tasks.named('clean'))
}

android.sourceSets.main.java.srcDir(generatedDir)
tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    dependsOn generateBuildSecrets
}

def containsBytes = { byte[] content, byte[] needle ->
    if (needle.length == 0 || needle.length > content.length) return false
    for (int start = 0; start <= content.length - needle.length; start++) {
        boolean matches = true
        for (int index = 0; index < needle.length; index++) {
            if (content[start + index] != needle[index]) {
                matches = false
                break
            }
        }
        if (matches) return true
    }
    false
}
def modifiedUtf8Bytes = { String value ->
    def output = new java.io.ByteArrayOutputStream()
    value.toCharArray().each { character ->
        int code = character as int
        if (code >= 0x0001 && code <= 0x007f) {
            output.write(code)
        } else if (code <= 0x07ff) {
            output.write(0xc0 | ((code >> 6) & 0x1f))
            output.write(0x80 | (code & 0x3f))
        } else {
            output.write(0xe0 | ((code >> 12) & 0x0f))
            output.write(0x80 | ((code >> 6) & 0x3f))
            output.write(0x80 | (code & 0x3f))
        }
    }
    output.toByteArray()
}
def streamContainsBytes = { InputStream input, byte[] needle ->
    byte[] buffer = new byte[65536 + needle.length - 1]
    int carry = 0
    int read
    while ((read = input.read(buffer, carry, 65536)) > 0) {
        int length = carry + read
        byte[] chunk = java.util.Arrays.copyOf(buffer, length)
        if (containsBytes(chunk, needle)) return true
        carry = Math.min(needle.length - 1, length)
        if (carry > 0) {
            System.arraycopy(buffer, length - carry, buffer, 0, carry)
        }
    }
    false
}
def releaseArtifactRoot = layout.buildDirectory.dir('outputs')
def verifyReleaseSecretObfuscation = tasks.register('verifyReleaseSecretObfuscation') {
    outputs.upToDateWhen { false }
    outputs.doNotCacheIf('Scans release APK/AAB for plaintext build secrets') { true }
    doLast {
        def secretValues = loadSecretValues()
        def artifactRoot = releaseArtifactRoot.get().asFile
        def artifacts = []
        if (artifactRoot.isDirectory()) {
            def artifactPaths = java.nio.file.Files.walk(artifactRoot.toPath())
            try {
                artifacts = artifactPaths
                        .filter { path ->
                            java.nio.file.Files.isRegularFile(path)
                                    && (path.toString().endsWith('.apk') || path.toString().endsWith('.aab'))
                        }
                        .map { path -> path.toFile() }
                        .collect(java.util.stream.Collectors.toList())
            } finally {
                artifactPaths.close()
            }
        }
        if (artifacts.isEmpty()) {
            throw new GradleException('Release APK/AAB not found for secret obfuscation verification')
        }
        def encodedSecrets = secretValues.findAll { name, value -> !value.isBlank() }.collectEntries { name, value ->
            [(name): [
                    value.getBytes(java.nio.charset.StandardCharsets.UTF_8),
                    modifiedUtf8Bytes(value),
                    value.getBytes(java.nio.charset.StandardCharsets.UTF_16LE),
                    value.getBytes(java.nio.charset.StandardCharsets.UTF_16BE)
            ]]
        }
        artifacts.each { artifact ->
            def archive = new java.util.zip.ZipFile(artifact)
            try {
                archive.entries().each { entry ->
                    encodedSecrets.each { name, encodings ->
                        encodings.each { encoding ->
                            def input = archive.getInputStream(entry)
                            try {
                                if (streamContainsBytes(input, encoding)) {
                                    throw new GradleException("Release artifact contains plaintext build secret: ${name}")
                                }
                            } finally {
                                input.close()
                            }
                        }
                    }
                }
            } finally {
                archive.close()
            }
        }
    }
}
def validateReleaseBuildSecrets = tasks.register('validateReleaseBuildSecrets') {
    doLast {
        def secretValues = loadSecretValues()
        def missing = releaseRequiredNames.findAll { name -> secretValues.get(name).isBlank() }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing required release secrets: ${missing.join(', ')}")
        }
        def tooShort = shortSecretNames(secretValues)
        if (!tooShort.isEmpty()) {
            throw new GradleException("Build secrets must be at least ${minimumSecretBytes} UTF-8 bytes: ${tooShort.join(', ')}")
        }
    }
}

tasks.matching { task ->
    task.name == 'packageRelease'
            || task.name == 'packageReleaseBundle'
            || task.name == 'packageReleaseUniversalApk'
}.configureEach {
    dependsOn validateReleaseBuildSecrets
    finalizedBy verifyReleaseSecretObfuscation
}
